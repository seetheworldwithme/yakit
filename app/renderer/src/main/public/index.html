<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Yakit" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!-- PWA manifest：声明桌面/移动端安装后的图标与启动信息 -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="stylesheet" href="./initial-loading.css" />
    <!--
      构建期 %PUBLIC_URL% 会被替换为 public 目录的最终 URL。
      引用 public 资源一律走 %PUBLIC_URL%，避免非根部署时路径错配。
    -->
    <title id="app-html-title">Loading</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: var(--yakit-colors-Neutral-0, #171717);
      }

      #root {
        min-height: 100vh;
        background: var(--yakit-colors-Neutral-0, #171717);
      }

      #initial-loading {
        display: flex;
        height: 100vh;
        align-items: center;
        justify-content: center;
        background: var(--yakit-colors-Neutral-0, #171717);
      }

      #initial-loading span {
        margin-right: 10px;
        font-size: 24px;
        color: var(--yakit-colors-Neutral-80);
      }

      #initial-loading .initial-spinner {
        box-sizing: border-box;
        width: 20px;
        height: 20px;
        border: 2px solid var(--yakit-colors-Neutral-40);
        border-top-color: var(--yakit-colors-Neutral-80);
        border-radius: 50%;
        animation: initial-spinner 0.8s linear infinite;
      }

      @keyframes initial-spinner {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <noscript>请启用 JavaScript 后再使用本应用。</noscript>
    <div id="root">
      <script>
        // 子窗口首屏占位：主窗口通过 window=child 打开时先渲染 loading，待渲染进程就绪后由 JS 移除
        if (window.location.search.includes('window=child')) {
          document.write('<div id="initial-loading"><span>正在加载中</span><div class="initial-spinner"></div></div>')
        }
      </script>
    </div>
    <!--
      该文件仅作模板：直接用浏览器打开会看到空白页。
      字体、meta、统计等可在本文件注入；构建产物会把打包后的脚本注入 <body>。
      开发：yarn start-render / 生产：yarn build
    -->
  </body>
</html>
