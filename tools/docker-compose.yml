version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: memfit-nginx
    ports:
      - "18888:8080"
    volumes:
      # 挂载打包好的前端 dist 目录
      - ./dist:/usr/share/nginx/html:ro
      # 挂载自定义 nginx 配置
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      # 让容器能通过 host.docker.internal 访问宿主机上运行的 Go 后端
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
